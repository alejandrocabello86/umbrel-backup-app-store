version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: alejandro-backup-duplicati_duplicati_1
      APP_PORT: 8200

  duplicati:
    image: duplicati/duplicati:2.4.0.1-stable
    restart: on-failure
    stop_grace_period: 1m

    environment:
      DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES: "*"
      SETTINGS_ENCRYPTION_KEY: "${APP_SEED}"

    volumes:
      - ${APP_DATA_DIR}/data:/data
      - "/data/umbrel-os/home/umbrel/umbrel/external/HD NAS/immich:/source/immich:ro"
      - "/data/umbrel-os/home/umbrel/umbrel/external/HD NAS/nextcloud:/source/nextcloud:ro"

  wol_helper:
    image: python:3.12-alpine
    restart: on-failure
    network_mode: host

    volumes:
      - ${APP_DATA_DIR}/data:/data

    command:
      - python3
      - /data/scripts/wol-helper.py

  shutdown_helper:
    image: alpine/git:2.52.0
    restart: on-failure

    volumes:
      - ${APP_DATA_DIR}/data/scripts:/scripts

    entrypoint:
      - /bin/sh
      - /scripts/shutdown-helper.sh
